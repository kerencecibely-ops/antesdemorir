<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f1a">
<meta name="description" content="Imperdibles antes de morir: películas, libros, anime, videojuegos y temas por aprender.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IADM">
<title>Imperdibles antes de morir</title>
<style>
:root{
  --bg:#0d0f1a; --bg2:#151829; --card:#1b1f35; --card2:#232845; --line:#2c3256;
  --tx:#eef0ff; --tx2:#a6abcf; --tx3:#6f75a0;
  --acc:#9b8cff; --ok:#5ee6a0; --warn:#ffb454;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(600px 400px at 85% -10%,rgba(155,140,255,.18),transparent 60%),
             radial-gradient(500px 400px at -10% 30%,rgba(76,201,240,.08),transparent 60%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + var(--safe-t)) 18px 24px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
header.top h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
header.top .sub{color:var(--tx2);font-size:14px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:19px;border:1px solid var(--line)}
h2.sec{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:center}
h2.sec span.cnt{letter-spacing:0;text-transform:none;font-weight:600}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:14px}
.tiny{color:var(--tx3);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:650;font-size:15px}
.btn.pri{background:linear-gradient(135deg,var(--c,var(--acc)),color-mix(in srgb,var(--c,var(--acc)) 60%,#000));border-color:transparent;color:#0d0f1a}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--c,var(--acc));color:#0d0f1a;border-color:transparent}
/* shelves */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.it{position:relative;border-radius:16px;padding:14px 13px 12px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 26%,var(--card)),var(--bg2) 75%);border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));overflow:hidden}
.it::after{content:attr(data-e);position:absolute;right:-6px;bottom:-14px;font-size:58px;opacity:.13}
.it .t{font-weight:750;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.it .p{font-size:12px;color:var(--tx2);margin-top:6px}
.it.stale{border-color:var(--warn)}
.it.stale .p{color:var(--warn)}
.empty{border:1.5px dashed var(--line);border-radius:16px;min-height:118px;display:grid;place-items:center;color:var(--tx3);font-weight:650;font-size:14px;text-align:center;padding:10px}
.catlbl{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
/* hero */
.hero{border-radius:22px;padding:18px;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 40%,var(--card)),var(--bg2) 70%);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.hero .k{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#fff);font-weight:800}
.hero .v{font-size:22px;font-weight:800;margin:6px 0 4px;line-height:1.2}
.streak{font-size:34px;font-weight:900;line-height:1}
.alert{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;background:rgba(255,180,84,.09);border:1px solid rgba(255,180,84,.35)}
.alert+.alert{margin-top:8px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + var(--safe-b));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:650;color:var(--tx3)}
nav.tabs button .i{font-size:22px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.on .i{filter:none;opacity:1}
/* roulette */
.wheel{display:grid;gap:10px;margin-top:14px}
.opt{border-radius:18px;padding:16px;text-align:left;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 22%,var(--card)),var(--bg2));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));transition:transform .15s}
.opt .t{font-size:18px;font-weight:800;line-height:1.25}
.opt .m{font-size:13px;color:var(--tx2);margin-top:4px}
.opt.spin .t{filter:blur(1.5px);opacity:.75}
.opt:active{transform:scale(.98)}
.bigspin{width:100%;padding:20px;border-radius:20px;font-size:19px;font-weight:850;color:#0d0f1a;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 10px 30px -10px var(--c)}
/* list */
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li .st{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:var(--card);flex:none}
.li .st.done{background:color-mix(in srgb,var(--ok) 25%,var(--card))}
.li .st.act{background:color-mix(in srgb,var(--c) 35%,var(--card))}
.li .t{font-weight:600;font-size:15px}
.li.done .t{color:var(--tx3);text-decoration:line-through}
/* progress */
.bar{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff))}
.big{font-size:44px;font-weight:900;letter-spacing:-1px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,6,12,.6);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 18px calc(22px + var(--safe-b));transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s .28s;max-height:88vh;overflow:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:22px;font-weight:850;line-height:1.2}
.stack{display:grid;gap:10px;margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:flex;gap:6px;font-size:30px}
.stars button{opacity:.3}
.stars button.on{opacity:1}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-20px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lang{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.pill{font-size:12px;font-weight:750;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--tx2)}
.pill.ok{background:color-mix(in srgb,var(--ok) 22%,var(--card));color:var(--ok)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.pop{animation:pop .35s ease}

/* selectores de la ruleta */
.picker{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;margin-top:8px;border-radius:16px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 16%,var(--card)),var(--bg2));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.picker.big{padding:14px 16px;border-width:1.5px;border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.picker .pe{font-size:28px}
.picker .pl{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);font-weight:800}
.picker .pv{display:block;font-size:19px;font-weight:850;margin-top:1px}
.picker .pv.sm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker .pa{color:var(--c);font-size:18px}
.picker[disabled]{opacity:.5}
.plist{display:grid;gap:8px;margin-top:14px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.prow .pe{font-size:26px}
.prow.on{background:color-mix(in srgb,var(--c) 22%,var(--card));border-color:var(--c)}
.prow .ck{color:var(--c);font-weight:900;font-size:18px}
.prow .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;color:#0d0f1a}
.prow.on .box{background:var(--c);border-color:var(--c)}
.mhead{margin:10px 2px 0;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.msticky{position:sticky;bottom:calc(-22px - var(--safe-b));margin:14px -18px calc(-22px - var(--safe-b));padding:12px 18px calc(16px + var(--safe-b));background:linear-gradient(180deg,transparent,var(--bg2) 30%)}
/* máquina */
.machine{position:relative;margin-top:18px;padding:14px 12px 12px;border-radius:30px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card2)),var(--bg2) 55%,color-mix(in srgb,var(--c) 18%,var(--bg)));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 24px 50px -18px color-mix(in srgb,var(--c) 55%,#000),inset 0 1px 0 rgba(255,255,255,.18)}
.machine::before{content:"";position:absolute;inset:-14px;z-index:-1;border-radius:40px;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 40%,transparent),transparent);filter:blur(22px);opacity:.55;transition:opacity .4s}
.machine.spinning::before{opacity:.95}
.marquee{text-align:center;font-weight:900;letter-spacing:3px;text-transform:uppercase;font-size:13px;padding:2px 0 8px;color:#fff;
  text-shadow:0 0 6px var(--c),0 0 16px var(--c)}
.marquee span{background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--c) 60%,#fff),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bulbs{display:flex;justify-content:space-between;padding:6px 10px}
.bulbs i{width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--c) 35%,#1a1d33);box-shadow:inset 0 -1px 2px rgba(0,0,0,.5);
  animation:bulb 1.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.11s)}
.machine.spinning .bulbs i{animation-duration:.42s}
.machine.won .bulbs i{animation:bulbwin .5s steps(2) infinite;animation-delay:calc(var(--i) * -.25s)}
@keyframes bulb{0%,100%{background:color-mix(in srgb,var(--c) 30%,#1a1d33);box-shadow:none}50%{background:#fff8e1;box-shadow:0 0 8px 2px var(--c),0 0 2px #fff}}
@keyframes bulbwin{0%{background:#fff8e1;box-shadow:0 0 10px 3px var(--c)}100%{background:color-mix(in srgb,var(--c) 30%,#1a1d33);box-shadow:none}}
.reelwrap{position:relative;border-radius:20px;padding:3px;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.04) 40%,rgba(0,0,0,.4))}
.reel{position:relative;height:340px;overflow:hidden;border-radius:17px;
  background:repeating-linear-gradient(180deg,transparent 0 67px,rgba(255,255,255,.035) 67px 68px),linear-gradient(180deg,#05060c,#13162a 50%,#05060c)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:17px;
  background:linear-gradient(180deg,#05060c 0%,rgba(5,6,12,.0) 30%,rgba(5,6,12,0) 70%,#05060c 100%),
             linear-gradient(90deg,rgba(0,0,0,.45),transparent 12%,transparent 88%,rgba(0,0,0,.45))}
.strip{will-change:transform;transform:translateZ(0)}
.strip.fast{filter:blur(1.2px)}
.cell{height:68px;display:flex;align-items:center;gap:13px;padding:0 20px;transform-origin:50% 50%;backface-visibility:hidden}
.badge{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px -4px rgba(0,0,0,.7)}
.cell .t{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.cell .s{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.win .t{color:#fff;text-shadow:0 0 14px var(--c),0 0 2px #fff}
.cell.win .badge{box-shadow:0 0 0 2px #fff,0 0 18px 2px var(--c)}
.band{position:absolute;left:-6px;right:-6px;top:139px;height:68px;pointer-events:none;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 45%,rgba(255,255,255,.06));
  border:2px solid color-mix(in srgb,var(--c) 75%,#fff);box-shadow:0 0 18px -2px var(--c),0 0 0 1px rgba(0,0,0,.6),inset 0 0 22px -8px var(--c)}
.machine.won .band{animation:bandwin 1s ease-in-out 3}
@keyframes bandwin{50%{box-shadow:0 0 34px 4px var(--c),0 0 0 1px rgba(0,0,0,.6),inset 0 0 30px -4px var(--c)}}
.band .shine{position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
.machine.won .band .shine{animation:shine .9s ease-out .1s 1}
@keyframes shine{to{left:130%}}
.reelwrap::before,.reelwrap::after{content:"";position:absolute;top:50%;z-index:2;width:0;height:0;margin-top:-11px;border:11px solid transparent;filter:drop-shadow(0 0 6px var(--c))}
.reelwrap::before{left:-14px;border-left-color:#fff}
.reelwrap::after{right:-14px;border-right-color:#fff}
.lever{display:block;width:100%;margin-top:18px;padding:0;border-radius:22px;background:color-mix(in srgb,var(--c) 45%,#000);padding-bottom:7px;transition:padding .08s,margin .08s}
.lever span{display:block;padding:19px;border-radius:22px;font-size:21px;font-weight:900;letter-spacing:4px;color:#0d0f1a;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 10px 28px -10px var(--c)}
.lever:active{padding-bottom:1px;margin-top:24px}
.lever[disabled]{opacity:.55}
.winner{margin-top:18px;border-radius:22px;padding:18px;text-align:center;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 38%,var(--card)),var(--bg2));border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));cursor:pointer}
.winner .k{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:color-mix(in srgb,var(--c) 70%,#fff)}
.winner .t{font-size:24px;font-weight:900;line-height:1.2;margin-top:6px}
.winner .m{color:var(--tx2);font-size:14px;margin-top:4px}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}

/* ---------- temas ---------- */
:root{--glow1:rgba(155,140,255,.18);--glow2:rgba(76,201,240,.08)}
body::before{background:radial-gradient(600px 400px at 85% -10%,var(--glow1),transparent 60%),radial-gradient(500px 400px at -10% 30%,var(--glow2),transparent 60%)!important}
[data-theme="casino"]{--bg:#07140f;--bg2:#0c1f17;--card:#12291f;--card2:#19362a;--line:#24473a;--tx:#f4efe0;--tx2:#b9c4b4;--tx3:#7d927f;--acc:#e8c15a;--glow1:rgba(232,193,90,.20);--glow2:rgba(46,160,100,.12)}
[data-theme="neon"]{--bg:#0e0618;--bg2:#160a26;--card:#1f0f35;--card2:#2a1546;--line:#3a1f5e;--tx:#fbefff;--tx2:#c7a9de;--tx3:#8a6aa6;--acc:#ff4fd8;--glow1:rgba(255,79,216,.22);--glow2:rgba(0,229,255,.12)}
[data-theme="oceano"]{--bg:#04141c;--bg2:#082029;--card:#0d2b36;--card2:#123745;--line:#1d4a5a;--tx:#e9fbff;--tx2:#9fc6d1;--tx3:#5f8f9c;--acc:#33d6c4;--glow1:rgba(51,214,196,.18);--glow2:rgba(64,140,255,.12)}
[data-theme="sakura"]{--bg:#170c12;--bg2:#21111a;--card:#2c1622;--card2:#3a1d2d;--line:#4d2a3d;--tx:#fff0f6;--tx2:#d8aec2;--tx3:#9a7287;--acc:#ff8fb8;--glow1:rgba(255,143,184,.20);--glow2:rgba(255,200,120,.08)}
[data-theme="ambar"]{--bg:#140d05;--bg2:#1d140a;--card:#281b0e;--card2:#352413;--line:#4a331c;--tx:#fff6e8;--tx2:#d6bf9c;--tx3:#9a8162;--acc:#ffa94d;--glow1:rgba(255,169,77,.20);--glow2:rgba(255,90,60,.08)}
[data-theme="papel"]{--bg:#f4eee4;--bg2:#fbf7f0;--card:#ffffff;--card2:#efe7da;--line:#e0d4c2;--tx:#2a2118;--tx2:#6b5d4d;--tx3:#9a8b78;--acc:#7c5cff;--glow1:rgba(124,92,255,.12);--glow2:rgba(255,169,77,.12)}
[data-theme="papel"] .it .t,[data-theme="papel"] .hero .v{color:var(--tx)}
[data-theme="papel"] .alert{background:rgba(255,160,40,.12)}
[data-theme="papel"] .hero .k,[data-theme="papel"] .winner .k{color:color-mix(in srgb,var(--c) 75%,#000)}
[data-theme="papel"] .machine{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 35%,#2a2230),#1d1720 60%)}
[data-theme="papel"] .bulbs i{background:color-mix(in srgb,var(--c) 30%,#2a2230)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border-radius:14px;padding:8px 4px 7px;border:2px solid var(--line);background:var(--card);font-size:11px;font-weight:700;color:var(--tx2);text-align:center}
.sw i{display:block;height:34px;border-radius:9px;margin-bottom:6px}
.sw.on{border-color:var(--acc);color:var(--tx)}
/* ---------- intro (splash) ---------- */
#intro{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:var(--bg);overflow:hidden;cursor:pointer}
#intro.on{display:grid}
#intro.out{animation:introOut .6s ease-in forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.08);filter:blur(6px)}}
#intro .glow{position:absolute;width:140vmax;height:140vmax;border-radius:50%;
  background:conic-gradient(from 0deg,var(--acc),#ff6b6b,#f2c14e,#80ed99,#4cc9f0,#c77dff,var(--acc));
  filter:blur(90px);opacity:0;animation:glowIn 2.6s ease-out .1s forwards, spinGlow 12s linear infinite;
  -webkit-mask:radial-gradient(closest-side,#000 0%,transparent 70%);mask:radial-gradient(closest-side,#000 0%,transparent 70%)}
@keyframes glowIn{to{opacity:.35}}
@keyframes spinGlow{to{transform:rotate(360deg)}}
#intro .stars{position:absolute;inset:0}
#intro .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.8}}
#intro .box{position:relative;text-align:center}
#intro .logo{display:flex;justify-content:center;gap:.04em;font-size:clamp(76px,24vw,150px);font-weight:900;line-height:1;letter-spacing:-.02em}
#intro .logo span{display:inline-block;background:linear-gradient(180deg,#fff 10%,var(--acc) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:scale(2.6) translateY(-10px);filter:blur(14px);animation:letterIn .55s cubic-bezier(.2,1.4,.4,1) forwards}
[data-theme="papel"] #intro .logo span{background:linear-gradient(180deg,#2a2118 10%,var(--acc) 120%);-webkit-background-clip:text;background-clip:text}
@keyframes letterIn{to{opacity:1;transform:none;filter:blur(0)}}
#intro .logo{animation:logoUp .7s cubic-bezier(.5,0,.2,1) 1.25s forwards}
@keyframes logoUp{to{transform:translateY(-22px) scale(.82)}}
#intro .flash{position:absolute;left:-20%;top:0;bottom:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);opacity:0;animation:flash .7s ease-out 1.05s forwards;mix-blend-mode:overlay}
@keyframes flash{0%{opacity:1;left:-30%}100%{opacity:0;left:120%}}
#intro .line{height:2px;width:0;margin:6px auto 14px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:line .8s ease-out 1.45s forwards}
@keyframes line{to{width:min(70vw,340px)}}
#intro .w1{font-size:clamp(22px,7vw,34px);font-weight:900;letter-spacing:.32em;text-transform:uppercase;color:var(--tx);padding-left:.32em}
#intro .w1 span{display:inline-block;opacity:0;transform:translateY(14px);animation:up .45s ease-out forwards}
@keyframes up{to{opacity:1;transform:none}}
#intro .w2{margin-top:8px;font-size:clamp(16px,5vw,22px);font-style:italic;font-weight:600;color:var(--tx2);letter-spacing:.06em;opacity:0;animation:fadeW 1s ease-out 2.35s forwards}
@keyframes fadeW{from{opacity:0;letter-spacing:.4em;filter:blur(4px)}to{opacity:1;letter-spacing:.06em;filter:none}}
#intro .tap{position:absolute;bottom:calc(30px + var(--safe-b));left:0;right:0;text-align:center;font-size:12px;color:var(--tx3);opacity:0;animation:fadeW .8s ease-out 3s forwards}
</style>

const SHELF_ORDER = ['anime','libros','juegos','aprender'];

const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const KEY = 'imperdibles.v1';
const DAY = 864e5;

/* ---------- estado ---------- */
const DEF = {
  items:{}, custom:{}, sessions:[], moviePick:null,
  langs:{principal:'Alemán', log:{}, maint:{}},
  rolls:{}, lastWebNotif:'',
  settings:{hour:'20:00', movieDay:5, movieHour:'20:00', staleDays:14},
  view:'hoy', cat:'anime'
};
let S;
function load(){
  try{ S = Object.assign(structuredClone(DEF), JSON.parse(localStorage.getItem(KEY)||'{}')); }
  catch(e){ S = structuredClone(DEF); }
  S.settings = Object.assign({}, DEF.settings, S.settings);
  S.langs = Object.assign({}, DEF.langs, S.langs);
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  scheduleNotifs(); if(typeof pwaState==='function') pwaState();
}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = (d=new Date()) => { const z=new Date(d); return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0'); };
const jsq = s => esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const idOf = (cat,t) => cat+'|'+t;
const daysSince = ts => ts ? Math.floor((Date.now()-ts)/DAY) : 999;
function ago(ts){ const d=daysSince(ts); return d<=0?'hoy':d===1?'ayer':`hace ${d} días`; }
function items(cat){ return (DATA[cat]||[]).concat(S.custom[cat]||[]).map(x=>({...x, id:idOf(cat,x.t), cat})); }
const st = id => S.items[id] || {};
function setSt(id, patch){ S.items[id] = Object.assign({}, S.items[id], patch); }
function activeOf(cat){ return items(cat).filter(x=>st(x.id).status==='activo').sort((a,b)=>(st(b.id).touched||0)-(st(a.id).touched||0)); }
function pendingOf(cat, f={}){
  return items(cat).filter(x=>{
    const s=st(x.id).status; if(s) return false;
    if(f.sec && x.s!==f.sec) return false;
    if(f.d && x.d!==f.d) return false;
    return true;
  });
}
function isStale(x){ return daysSince(st(x.id).touched) >= S.settings.staleDays; }
function staleAll(){ return SHELF_ORDER.flatMap(activeOf).filter(isStale); }
function hash(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function pick(arr,n){ const a=[...arr], out=[]; while(a.length && out.length<n){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); } return out; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2200); }
function langStreak(){
  let n=0, d=new Date();
  if(!S.langs.log[today(d)]) d=new Date(Date.now()-DAY);
  while(S.langs.log[today(d)]){ n++; d=new Date(d.getTime()-DAY); }
  return n;
}
function findItem(id){ const cat=id.split('|')[0]; return items(cat).find(x=>x.id===id); }

/* ---------- navegación ---------- */
const TABS = [['hoy','🏠','Hoy'],['ruleta','🎲','Ruleta'],['catalogo','🗂️','Catálogo'],['progreso','📈','Progreso']];
function go(v){ S.view=v; save(); render(); window.scrollTo(0,0); }
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([k,i,n])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')"><span class="i">${i}</span>${n}</button>`).join('');
}
function render(){
  renderTabs();
  const v = {hoy:vHoy, ruleta:vRuleta, catalogo:vCatalogo, progreso:vProgreso}[S.view] || vHoy;
  const anim = render.last!==S.view; render.last=S.view;
  $('#app').innerHTML = `<div class="${anim?'fade':''}">${v()}</div>`;
  if(S.view==='ruleta') paintStrip();
}

/* ---------- HOY ---------- */
function itemCard(x){
  const s=st(x.id), c=CATS[x.cat], stale=isStale(x);
  return `<button class="it ${stale?'stale':''}" style="--c:${c.c}" data-e="${c.e}" onclick="openItem('${jsq(x.id)}')">
    <div class="t">${esc(x.t)}</div>
    <div class="p">${s.progress?esc(s.progress)+' · ':''}${stale?'⏳ ':''}${ago(s.touched)}</div></button>`;
}
function vHoy(){
  const d=new Date();
  let fecha=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}); fecha=fecha[0].toUpperCase()+fecha.slice(1);
  let h=`<header class="top"><div><div class="sub">${fecha}</div><h1>Hola, Si</h1></div>
    <button class="iconbtn" onclick="openSettings()">⚙️</button></header>`;

  const stale=staleAll();
  if(stale.length){
    h+=`<h2 class="sec">Te están esperando</h2>`;
    h+=stale.slice(0,3).map(x=>`<div class="alert"><div class="grow"><div style="font-weight:700">${esc(x.t)}</div>
      <div class="tiny">${CATS[x.cat].e} ${daysSince(st(x.id).touched)} días sin tocarlo</div></div>
      <button class="btn sm" onclick="touch('${jsq(x.id)}')">Retomar</button>
      <button class="btn sm" onclick="swapOut('${jsq(x.id)}')">Cambiar</button></div>`).join('');
  }

  // idioma
  const L=S.langs, done=!!L.log[today()], sk=langStreak();
  h+=`<h2 class="sec">Idioma del día</h2>
  <div class="hero" style="--c:#ffa94d"><div class="row"><div class="grow">
    <div class="k">Principal</div><div class="v">${esc(L.principal)}</div>
    <div class="muted">${done?'Listo por hoy. Así se construye.':'Tu mínimo diario: 15 minutos.'}</div></div>
    <div style="text-align:center"><div class="streak">${sk}</div><div class="tiny">días seguidos</div></div></div>
    <div style="margin-top:14px"><button class="btn ${done?'':'pri'} full" style="--c:#ffa94d" onclick="langDone()">${done?'✓ Práctica hecha':'Practiqué hoy'}</button></div>
    ${LANGS.filter(l=>l!==L.principal).map(l=>{const ok=daysSince(L.maint[l])<7;
      return `<div class="lang"><span class="muted">${l} <span class="tiny">· mantenimiento semanal</span></span>
      <button class="pill ${ok?'ok':''}" onclick="maintDone('${l}')">${ok?'✓ esta semana':'marcar'}</button></div>`}).join('')}
  </div>`;

  // aprender hoy
  const ap=activeOf('aprender');
  if(ap.length){
    const t=ap[hash(today())%ap.length];
    h+=`<h2 class="sec">Hoy toca aprender</h2>
    <div class="hero" style="--c:${CATS.aprender.c}"><div class="k">${esc(t.s)}</div><div class="v">${esc(t.t)}</div>
    <div class="muted">Una sesión corta. Al terminar, explica en 2 líneas lo que aprendiste.</div>
    <div class="grid2" style="margin-top:14px"><button class="btn pri" style="--c:${CATS.aprender.c}" onclick="sessionDone('${jsq(t.id)}')">Hice la sesión</button>
    <button class="btn" onclick="openItem('${jsq(t.id)}')">Ver tema</button></div></div>`;
  }

  // película
  const mp=S.moviePick && findItem(S.moviePick);
  h+=`<h2 class="sec">Película</h2>`;
  h+= mp ? `<div class="hero" style="--c:${CATS.peliculas.c}"><div class="k">Por ver</div><div class="v">${esc(mp.t)}</div><div class="muted">${esc(mp.m||'')}</div>
      <div class="grid2" style="margin-top:14px"><button class="btn pri" style="--c:${CATS.peliculas.c}" onclick="finish('${jsq(mp.id)}')">Ya la vi</button>
      <button class="btn" onclick="S.moviePick=null;save();openRuleta('peliculas')">Cambiar</button></div></div>`
    : `<button class="bigspin" style="--c:${CATS.peliculas.c}" onclick="openRuleta('peliculas')">🎬 Noche de película</button>`;

  // estantes
  for(const k of SHELF_ORDER){
    const c=CATS[k], act=activeOf(k);
    h+=`<h2 class="sec"><span class="catlbl" style="--c:${c.c}"><i class="dot"></i>${c.n}</span><span class="cnt">${act.length}/${c.shelf}</span></h2><div class="shelf">`;
    h+=act.map(itemCard).join('');
    for(let i=act.length;i<c.shelf;i++) h+=`<button class="empty" onclick="openRuleta('${k}')">＋ Llenar con ruleta</button>`;
    h+=`</div>`;
  }
  return h;
}

/* ---------- acciones ---------- */
function touch(id, progress){
  const p={touched:Date.now()}; if(progress!==undefined) p.progress=progress;
  setSt(id,p); save(); closeSheet(); render(); toast('¡Bien! Sigue así 💪');
}
function swapOut(id){
  const cat=id.split('|')[0];
  setSt(id,{status:undefined, touched:undefined}); delete S.items[id].status;
  save(); closeSheet(); openRuleta(cat); toast('Lo regresé a la lista. Elige otro.');
}
function shelve(id){
  const cat=id.split('|')[0];
  if(cat==='peliculas'){ S.moviePick=id; save(); closeSheet(); go('hoy'); toast('Película elegida 🍿'); return; }
  if(activeOf(cat).length>=CATS[cat].shelf){ openFull(id); return; }
  setSt(id,{status:'activo', added:Date.now(), touched:Date.now()}); save(); closeSheet(); render(); toast('Al estante ✨');
}
function openFull(id){
  const cat=id.split('|')[0], x=findItem(id);
  sheet(`<h3>Estante lleno</h3><p class="muted" style="margin-top:6px">Para meter <b>${esc(x.t)}</b>, saca uno. No es fallar: es elegir.</p>
  <div class="stack">${activeOf(cat).map(a=>`<button class="btn full" onclick="replace('${jsq(a.id)}','${jsq(id)}')">Cambiar por «${esc(a.t)}»</button>`).join('')}
  <button class="btn full" onclick="closeSheet()">Mejor no</button></div>`);
}
function replace(outId,inId){
  delete S.items[outId].status;
  setSt(inId,{status:'activo', added:Date.now(), touched:Date.now()}); save(); closeSheet(); go('hoy'); toast('Estante actualizado');
}
function finish(id){
  const x=findItem(id);
  sheet(`<h3>¡Terminado!</h3><p class="muted" style="margin:6px 0 14px">${esc(x.t)}</p>
  <div class="tiny">¿Qué tal estuvo?</div>
  <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button onclick="rate(${n})">★</button>`).join('')}</div>
  <textarea id="fnote" rows="3" placeholder="Una línea para tu yo del futuro (opcional)" style="margin-top:12px"></textarea>
  <div class="stack"><button class="btn pri full" onclick="confirmFinish('${jsq(id)}')">Guardar</button></div>`);
  finish.r=0;
}
function rate(n){ finish.r=n; document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('on',i<n)); }
function confirmFinish(id){

  const secs=new Set(F.secs);
  return F.cats.flatMap(k=>items(k)).filter(x=>{
    if(pendingOnly && st(x.id).status) return false;
    if(secs.size && !secs.has(x.cat+'|'+x.s)) return false;

let AC, lastTick=0;
function audio(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
  }catch(e){ AC=null; }
  return AC;
}
function tick(speed){
  const now=performance.now();
  if(now-lastTick<38) return;            // a alta velocidad no se amontonan los clics
  lastTick=now;
  const ac=AC; if(ac && ac.state==='running'){
    try{
      const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
      o.type='square'; o.frequency.setValueAtTime(1800+Math.min(speed||0,1)*500,t);
      f.type='bandpass'; f.frequency.value=2200; f.Q.value=1.2;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.09,t+.002); g.gain.exponentialRampToValueAtTime(.0001,t+.035);
      o.connect(f).connect(g).connect(ac.destination); o.start(t); o.stop(t+.04);
    }catch(e){}
  }
  if(navigator.vibrate) navigator.vibrate(6);
}
function chime(){
  try{ if(!AC) return;
    [660,880,1320].forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+i*.09;
      o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.15,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.55); });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([20,40,60]);
}
function confetti(color){
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  const dpr=devicePixelRatio||1, W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr, x=cv.getContext('2d');
  const cols=[color,'#ffffff','#ffd166','#9b8cff','#5ee6a0'];
  const ps=Array.from({length:110},()=>({x:W/2,y:H*.42,vx:(Math.random()-.5)*16*dpr,vy:(-Math.random()*15-4)*dpr,r:(Math.random()*5+3)*dpr,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let f=0; (function loop(){ x.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.45*dpr; p.vx*=.99; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.globalAlpha=Math.max(0,1-f/90); x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(++f<95) requestAnimationFrame(loop); else cv.remove(); })();
}
function stripY(){ return R.y+MID*CELL; }
function paintStrip(){
  const el=document.getElementById('strip'); if(!el) return el;
  el.style.transform=`translateY(${stripY()}px)`;
  const ci=-R.y/CELL, cells=el.children;
  for(let i=Math.max(0,Math.floor(ci)-4); i<=Math.min(cells.length-1,Math.ceil(ci)+4); i++){
    const d=i-ci, ad=Math.min(Math.abs(d),3);
    cells[i].style.transform=`perspective(520px) rotateX(${(-d*17).toFixed(2)}deg) scale(${(1-ad*.045).toFixed(3)})`;
    cells[i].style.opacity=(1-ad*.18).toFixed(2);
  }
  return el;
}
function spin(reroll){
  if(R.spinning) return;
  if(document.getElementById('spinbtn')) document.getElementById('spinbtn').disabled=true;
  audio();                                           // desbloquea el sonido dentro del toque
  const pool=poolFor(R,true); if(!pool.length) return;
  if(reroll){ if(rollsLeft()<=0) return; const k=rollKey(); S.rolls[k]=(S.rolls[k]||0)+1; save(); }
  const ci=Math.round(-R.y/CELL);
  const keep=R.wheel.slice(Math.max(0,ci-MID), ci+MID+1);
  while(keep.length<VIS) keep.unshift(pool[Math.floor(Math.random()*pool.length)]);
  const strip=[...keep], L=VIS+40+Math.floor(Math.random()*8);
  while(strip.length<L) strip.push(pool[Math.floor(Math.random()*pool.length)]);
  const w=L-1-MID;
  R.wheel=strip; R.winIdx=-1; R.win=null; R.alts=[]; R.spinning=true; R.y=-MID*CELL;
  const elS=document.getElementById('strip');
  if(!elS){ render(); } else {
    elS.innerHTML=strip.map(cellHTML).join('');
    const mach=document.querySelector('.machine'); mach.classList.add('spinning'); mach.classList.remove('won');
    const c=look(R).c;
    document.getElementById('rres').innerHTML=`<button class="lever" id="spinbtn" style="--c:${c}" disabled><span>GIRANDO…</span></button>`;
    document.querySelectorAll('#app .picker, #app .chip').forEach(x=>x.disabled=true);
  }
  paintStrip();
  const from=R.y, to=-w*CELL, over=CELL*(.3+Math.random()*.15);
  const T1=4900, T2=550, t0=performance.now();
  const t0n=.12, k=1/(1-t0n/2);
  const ramp=t=> t<t0n ? k*t*t/(2*t0n) : k*(t0n/2+(t-t0n));      // acelera desde 0
  const easeOut=t=>1-Math.pow(1-ramp(t),4);                    // y frena suave
  const back=t=>{ const c=1.6; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); };
  let lastIdx=Math.round(-R.y/CELL), prevY=R.y;
  function frame(now){
    const e=now-t0;
    if(e<T1) R.y=from+(to-over-from)*easeOut(e/T1);
    else if(e<T1+T2) R.y=(to-over)+over*back((e-T1)/T2);
    else R.y=to;
    const el=paintStrip();
    const speed=Math.abs(R.y-prevY)/CELL; prevY=R.y;
    if(el) el.classList.toggle('fast', speed>.35);
    const idx=Math.round(-R.y/CELL);
    if(idx!==lastIdx){ tick(speed); lastIdx=idx; }
    if(e<T1+T2) requestAnimationFrame(frame); else land(w,pool);
  }
  requestAnimationFrame(frame);
}
function land(w,pool){
  R.spinning=false; R.winIdx=w; R.win=R.wheel[w];
  const seen=new Set([R.win.id]); R.alts=[];
  for(const x of pick(pool,8)){ if(!seen.has(x.id)&&R.alts.length<2){ R.alts.push(x); seen.add(x.id);} }
  chime();
  if(S.view==='ruleta'){ confetti(CATS[R.win.cat].c); render();
    setTimeout(()=>{ const wn=document.querySelector('.winner'); if(wn) wn.scrollIntoView({behavior:'smooth',block:'center'}); },200); }
}

  let h='', last='';
  for(const x of all.slice(0,C.lim)){
    const c=CATS[x.cat], s=st(x.id).status, head=x.cat+'|'+x.s;
    if(head!==last){ h+=`<h2 class="sec">${multi?c.e+' ':''}${esc(x.s)}</h2>`; last=head; }
    const ic = s==='hecho'?'✓':s==='activo'?c.e:s==='descartado'?'✕':'';
    h+=`<button class="li ${s==='hecho'?'done':''}" style="--c:${c.c}" onclick="openItem('${jsq(x.id)}')">
      <span class="st ${s==='hecho'?'done':s==='activo'?'act':''}">${ic}</span>
      <span class="grow"><div class="t">${esc(x.t)}</div>${x.m||x.u?`<div class="tiny">${esc([x.u,x.m].filter(Boolean).join(' · '))}</div>`:''}</span></button>`;
  }
  if(all.length>C.lim) h+=`<button class="btn full" style="margin-top:12px" onclick="C.lim+=150;document.getElementById('clist').innerHTML=catList()">Mostrar más (${all.length-C.lim})</button>`;
  if(!all.length) h+=`<p class="muted" style="text-align:center;padding:30px">Nada por aquí.</p>`;
  return h;
}
function addCustom(){
  const cat=(C.cats&&C.cats[0])||S.cat;
  sheet(`<h3>Agregar al catálogo</h3><div class="stack">
  <select id="cc" onchange="document.getElementById('csl').innerHTML=secOpts(this.value)">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===cat?'selected':''}>${v.e} ${v.n}</option>`).join('')}</select>
  <input id="ct" placeholder="Título"><input id="cm" placeholder="Autor, año o nota (opcional)">
  <input id="cs" list="csl" placeholder="Sección (elige o escribe una nueva)"><datalist id="csl">${secOpts(cat)}</datalist>
  <button class="btn pri full" onclick="saveCustom()">Agregar</button></div>`);
}
function secOpts(cat){ return [...new Set(items(cat).map(x=>x.s))].map(s=>`<option value="${esc(s)}">`).join(''); }
function saveCustom(){
  const t=$('#ct').value.trim(); if(!t){ toast('Escribe un título'); return; }
  const cat=$('#cc').value; if(items(cat).some(x=>x.t===t)){ toast('Ya está en la lista'); return; }
  (S.custom[cat]=S.custom[cat]||[]).push({t, m:$('#cm').value.trim()||undefined, s:$('#cs').value.trim()||'Agregados por mí'});
  save(); closeSheet(); render(); toast('Agregado');
}

/* ---------- PROGRESO ---------- */
function vProgreso(){
  let tot=0, done=0;
  const rows=Object.entries(CATS).map(([k,c])=>{
    const all=items(k), d=all.filter(x=>st(x.id).status==='hecho').length;
    tot+=all.length; done+=d;
    return `<div class="card" style="--c:${c.c}"><div class="row"><div class="grow catlbl"><i class="dot"></i><b>${c.e} ${c.n}</b></div><span class="muted">${d} / ${all.length}</span></div>
    <div class="bar"><i style="width:${all.length?Math.max(d/all.length*100,d?1.5:0):0}%"></i></div></div>`;
  }).join('');
  const recent=Object.entries(S.items).filter(([,v])=>v.status==='hecho').sort((a,b)=>b[1].done-a[1].done).slice(0,8);
  let h=`<header class="top"><div><div class="sub">Imperdibles antes de morir</div><h1>Progreso</h1></div>
  <button class="iconbtn" onclick="openSettings()">⚙️</button></header>
  <div class="hero" style="--c:var(--acc)"><div class="k">Completado</div><div class="row"><div class="big">${(done/tot*100).toFixed(1)}%</div>
  <div class="grow muted" style="text-align:right">${done} de ${tot}<br>Racha de idioma: ${langStreak()} 🔥</div></div></div>
  <h2 class="sec">Por colección</h2>${rows}`;
  if(recent.length) h+=`<h2 class="sec">Últimos terminados</h2><div class="card">${recent.map(([id,v])=>{const x=findItem(id);return x?`<div class="lang" style="border:0"><span>${CATS[x.cat].e} ${esc(x.t)}</span><span class="tiny">${v.rating?'★'.repeat(v.rating):ago(v.done)}</span></div>`:''}).join('')}</div>`;
  if(S.sessions.length) h+=`<h2 class="sec">Lo que has aprendido</h2>${S.sessions.slice(0,6).map(s=>{const x=findItem(s.id);return `<div class="card"><div class="tiny">${x?esc(x.t):''} · ${ago(s.date)}</div><div style="margin-top:4px">${esc(s.note||'(sin nota)')}</div></div>`}).join('')}`;
  return h;
}

/* ---------- AJUSTES ---------- */
function openSettings(){
  const s=S.settings;
  sheet(`<h3>Ajustes</h3><div class="stack">
  <label class="tiny">Tema</label>${themeGrid()}
  <label class="tiny" style="margin-top:6px">Idioma principal (los demás quedan en mantenimiento semanal)</label>
  <select id="sl">${LANGS.map(l=>`<option ${S.langs.principal===l?'selected':''}>${l}</option>`).join('')}</select>
  <label class="tiny">Recordatorio diario de idioma</label><input id="sh" type="time" value="${s.hour}">
  <div class="grid2"><div><label class="tiny">Noche de película</label><select id="smd">${DAYS.map((d,i)=>`<option value="${i}" ${+s.movieDay===i?'selected':''}>${d}</option>`).join('')}</select></div>
  <div><label class="tiny">Hora</label><input id="smh" type="time" value="${s.movieHour}"></div></div>
  <label class="tiny">Avisarme si algo del estante lleva sin tocarse (días)</label><input id="ss" type="number" min="3" max="60" value="${s.staleDays}">
  <button class="btn pri full" onclick="saveSettings()">Guardar</button>
  <button class="btn full" onclick="askNotif()">🔔 Activar notificaciones</button>
  ${isStandalone()?'':`<button class="btn full" onclick="installApp()">📲 Instalar en el teléfono</button>`}
  <div class="grid2"><button class="btn" onclick="exportData()">⬇️ Respaldo</button><button class="btn" onclick="document.getElementById('imp').click()">⬆️ Restaurar</button></div>
  <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this.files[0])">
  <button class="btn full" onclick="closeSheet();showIntro()">✨ Ver la intro</button>
  <p class="tiny">Tu progreso se guarda en este dispositivo. Haz un respaldo de vez en cuando.</p></div>`);
}
function saveSettings(){
  S.langs.principal=$('#sl').value;
  Object.assign(S.settings,{hour:$('#sh').value||'20:00', movieDay:+$('#smd').value, movieHour:$('#smh').value||'20:00', staleDays:Math.max(3,+$('#ss').value||14)});
  save(); closeSheet(); render(); toast('Ajustes guardados');
}
function exportData(){
  const blob=new Blob([JSON.stringify({...S, view:'hoy'})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`imperdibles-respaldo-${today()}.json`; a.click();
}
function importData(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.items) throw 0; S=Object.assign(structuredClone(DEF),d); S.settings=Object.assign({},DEF.settings,S.settings); save(); applyTheme(); closeSheet(); render(); toast('Respaldo restaurado'); }catch(e){ toast('Ese archivo no es un respaldo válido'); } };
  r.readAsText(f);
}

/* ---------- TEMAS ---------- */
const THEMES=[
  ['noche','Noche','linear-gradient(135deg,#0d0f1a,#232845 60%,#9b8cff)','#0d0f1a'],
  ['casino','Casino','linear-gradient(135deg,#07140f,#19362a 60%,#e8c15a)','#07140f'],
  ['neon','Neón','linear-gradient(135deg,#0e0618,#2a1546 55%,#ff4fd8)','#0e0618'],
  ['oceano','Océano','linear-gradient(135deg,#04141c,#123745 55%,#33d6c4)','#04141c'],
  ['sakura','Sakura','linear-gradient(135deg,#170c12,#3a1d2d 55%,#ff8fb8)','#170c12'],
  ['ambar','Ámbar','linear-gradient(135deg,#140d05,#352413 55%,#ffa94d)','#140d05'],
  ['papel','Papel','linear-gradient(135deg,#fbf7f0,#efe7da 55%,#7c5cff)','#f4eee4']
];
function applyTheme(){
  const t=S.settings.theme||'noche';
  document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name="theme-color"]'); const th=THEMES.find(x=>x[0]===t); if(m&&th) m.content=th[3];
}
function themeGrid(){
  const cur=S.settings.theme||'noche';
  return `<div class="themes">${THEMES.map(([k,n,g])=>`<button class="sw ${cur===k?'on':''}" onclick="setTheme('${k}',this)"><i style="background:${g}"></i>${n}</button>`).join('')}</div>`;
}
function setTheme(k,el){
  S.settings.theme=k; save(); applyTheme();
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b===el));
  render();
}

/* ---------- INTRO (pantalla de entrada) ---------- */
let introT;
function showIntro(){
  const el=$('#intro');
  const stars=Array.from({length:40},()=>`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*2.4).toFixed(2)}s"></i>`).join('');
  const word='Imperdibles'.split('').map((ch,i)=>`<span style="animation-delay:${(1.55+i*.06).toFixed(2)}s">${ch}</span>`).join('');
  el.innerHTML=`<div class="glow"></div><div class="stars">${stars}</div>
    <div class="box"><div class="logo">${'IADM'.split('').map((ch,i)=>`<span style="animation-delay:${(.15+i*.2).toFixed(2)}s">${ch}</span>`).join('')}</div>
    <div class="flash"></div><div class="line"></div><div class="w1">${word}</div><div class="w2">antes de morir</div></div>
    <div class="tap">Toca para entrar</div>`;
  el.className='on';
  el.onclick=endIntro;
  clearTimeout(introT); introT=setTimeout(endIntro,4200);
  setTimeout(()=>{ if(AC) chime(); },150);
}
function endIntro(){
  const el=$('#intro'); if(!el.classList.contains('on')||el.classList.contains('out')) return;
  clearTimeout(introT); el.classList.add('out');
  setTimeout(()=>{ el.className=''; el.innerHTML=''; },600);
}

/* ---------- NOTIFICACIONES ---------- */
const LN = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
async function askNotif(){
  if(LN()){ const p=await LN().requestPermissions(); toast(p.display==='granted'?'Notificaciones activadas 🔔':'Permiso denegado'); scheduleNotifs(); return; }
  if('Notification' in window){ const p=await Notification.requestPermission(); toast(p==='granted'?'Notificaciones activadas 🔔':'Permiso denegado');
    if(p==='granted'){ await registerPeriodic(); pwaState(); } }
  else toast('Este navegador no permite notificaciones');
}
let schedT;
function scheduleNotifs(){
  if(!LN()) return;
  clearTimeout(schedT);
  schedT=setTimeout(async()=>{
    try{
      const ln=LN(), s=S.settings, [h,m]=s.hour.split(':').map(Number), [mh,mm]=s.movieHour.split(':').map(Number);
      await ln.cancel({notifications:[{id:1},{id:2},{id:3}]});
      const list=[
        {id:1,title:`${S.langs.principal} 🔥`,body:`Tus 15 minutos de hoy. Racha actual: ${langStreak()} días.`,schedule:{on:{hour:h,minute:m},allowWhileIdle:true}},
        {id:2,title:'Noche de película 🎬',body:'Abre la ruleta: tres opciones, eliges una y listo.',schedule:{on:{weekday:+s.movieDay+1,hour:mh,minute:mm},allowWhileIdle:true}}
      ];
      const act=SHELF_ORDER.flatMap(activeOf);
      if(act.length){
        const old=act.reduce((a,b)=>(st(a.id).touched||0)<(st(b.id).touched||0)?a:b);
        const at=new Date((st(old.id).touched||Date.now())+s.staleDays*DAY); at.setHours(h,m+1,0,0);
        if(at>new Date()) list.push({id:3,title:`¿Sigues con ${old.t}?`,body:`Lleva ${s.staleDays} días en tu estante sin tocarse. Retómalo o cámbialo, sin culpa.`,schedule:{at,allowWhileIdle:true}});
      }
      await ln.schedule({notifications:list});
    }catch(e){ console.log('notif',e); }
  },600);
}
async function notify(title, body){
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg) await reg.showNotification(title,{body, icon:'icons/icon-192.png', badge:'icons/maskable-192.png'});
    else new Notification(title,{body});
    S.lastWebNotif=today(); save();
  }catch(e){}
}
/* ---------- PWA ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; });
window.addEventListener('appinstalled',()=>{ installEvt=null; toast('¡Instalada! Búscala como IADM 📲'); });
async function installApp(){
  if(installEvt){ installEvt.prompt(); await installEvt.userChoice; installEvt=null; closeSheet(); return; }
  toast(/iphone|ipad/i.test(navigator.userAgent)?'En Safari: Compartir → Agregar a inicio':'En el menú del navegador: Instalar app / Agregar a inicio');
}
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches || navigator.standalone;
// estado mínimo que el service worker lee para avisar aunque la app esté cerrada
let pwaT;
function pwaState(){
  if(!('caches' in window) || LN()) return;
  clearTimeout(pwaT);
  pwaT=setTimeout(async()=>{
    try{
      const c=await caches.open('iadm-state'), old=await c.match('./__state'), prev=old?await old.json():{};
      const st=staleAll().sort((a,b)=>(st0(a))-(st0(b)))[0];
      await c.put('./__state', new Response(JSON.stringify({
        sent:prev.sent||{}, hour:S.settings.hour, movieDay:S.settings.movieDay, movieHour:S.settings.movieHour,
        lang:S.langs.principal, langDone:S.langs.log[today()]?today():'', streak:langStreak(),
        stale: st?{t:st.t, d:daysSince(st0(st))}:null
      }),{headers:{'Content-Type':'application/json'}}));
    }catch(e){}
  },400);
}
const st0=x=>st(x.id).touched||0;
async function registerPeriodic(){
  try{
    const reg=await navigator.serviceWorker.ready;
    if('periodicSync' in reg){
      const p=await navigator.permissions.query({name:'periodic-background-sync'});
      if(p.state==='granted') await reg.periodicSync.register('iadm-nudge',{minInterval:3*60*60*1000});
    }
  }catch(e){}
}
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(()=>{ if(window.Notification && Notification.permission==='granted') registerPeriodic(); }).catch(()=>{});
  });
}
function webNudge(){
  if(LN() || !('Notification' in window) || Notification.permission!=='granted') return;
  if(S.lastWebNotif===today()) return;
  const stale=staleAll(), [h,m]=S.settings.hour.split(':').map(Number), now=new Date();
  let msg=null;
  if(stale.length) msg=[`¿Sigues con ${stale[0].t}?`,`Lleva ${daysSince(st(stale[0].id).touched)} días sin tocarse.`];
  else if(!S.langs.log[today()] && (now.getHours()>h || (now.getHours()===h && now.getMinutes()>=m))) msg=[`${S.langs.principal} 🔥`,'Todavía te faltan tus 15 minutos de hoy.'];
  if(msg) notify(msg[0],msg[1]);
}

/* ---------- inicio ---------- */
$('#scrim').onclick=closeSheet;
document.addEventListener('pointerdown',()=>audio(),{once:true});
load(); applyTheme(); pruneRolls();
{ const h=location.hash.slice(1); if(['hoy','ruleta','catalogo','progreso'].includes(h)) S.view=h; }
render(); showIntro(); scheduleNotifs(); setTimeout(webNudge,1500);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ render(); webNudge(); } });
</script>
